# Blueprint for building Bacon Tools in the cloud
workflows:
  android-workflow:
    name: Bacon Tools Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
    triggering:
      events:
        - push
    scripts:
      - name: Fetch App Dependencies
        script: |
          flutter pub get
      - name: Build Standalone Release APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
